<title>CS Society · Community action for your street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ever:#071B19;--ever2:#102A25;--map:#EAF3EC;--leaf:#A9F36D;--teal:#4CD690;--teal-d:#1B7F4E;
  color-scheme:light;--paper:#FFFFFF;--card:#FFFFFF;--ink:#10231A;--muted:#52665A;--line:#E3EBE4;--line2:#AFC4B6;
  --focus:#1B7F4E;--link:#1B7F4E;--red:#A12F22;--red-bg:#F8DDD7;--amber:#7A4B00;
  --new-bg:#FBEBC4;--new-fg:#6B4200;--clm-bg:#D2EFEC;--clm-fg:#0A5A56;--prg-bg:#DDF1CF;--prg-fg:#255C1B;--res-bg:#CFE8D6;--res-fg:#12482A;
  --bar-a:#BFE3DF;--bar-b:#0E766F;--soft:#F2F8F1;
  --f-d:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;--f-b:'Inter','Segoe UI',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --paper:#08201C;--card:#0E2B26;--ink:#E7F0EA;--muted:#A9BDB3;--line:#21443C;--line2:#4C7066;--focus:#8DE7DB;--link:#8DE7DB;--red:#FF9C8C;--red-bg:#4A1E19;--amber:#F0C46A;
  --new-bg:#4B3606;--new-fg:#FFE0A0;--clm-bg:#0F4743;--clm-fg:#A8F0E8;--prg-bg:#1E4217;--prg-fg:#C5F0B0;--res-bg:#1B4A30;--res-fg:#BFEBCC;
  --bar-a:#1A4E49;--bar-b:#7FE0D4;--soft:#123630}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--f-b);min-height:100vh}
h1,h2,h3,h4{font-family:var(--f-d);line-height:1.12;letter-spacing:-.012em;margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(2rem,5vw,3.25rem);font-weight:800}
h2{font-size:clamp(1.4rem,3vw,1.9rem)}
h3{font-size:1.15rem}
p{margin:0 0 1em}
a{color:var(--link)}
img,svg{max-width:100%}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--leaf);color:var(--ever);padding:10px 14px;border-radius:10px;font-weight:700;z-index:100}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.top :focus-visible,.hero :focus-visible,.tabbar :focus-visible,.dark :focus-visible{outline-color:#B5F5CC}
.ic{flex:none;vertical-align:-.2em}
.muted{color:var(--muted)}
.btn.hide-sm{display:none}

/* demo strip + header */
.demo{background:#071C19;color:#B9D3C8;font-size:.82rem;padding:6px 0;text-align:center}
.demo p{margin:0}
.top{background:var(--ever);color:#EAF4EE;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid rgba(255,255,255,.08)}
.bar{display:flex;align-items:center;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.18rem var(--f-d);color:#fff;text-decoration:none;letter-spacing:-.01em}
.brand span{display:none}
.primary{display:none;gap:4px;margin-left:10px}
.primary a{padding:9px 14px;border-radius:10px;color:#CFE3D8;text-decoration:none;font-weight:600}
.primary a:hover{color:#fff;background:rgba(255,255,255,.07)}
.primary a[aria-current=page]{background:rgba(255,255,255,.13);color:#fff}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#CFE3D8;padding:6px 11px;border-radius:999px;font:600 .82rem var(--f-b);min-height:34px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--leaf);color:var(--ever)}
.rolechip{font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1)}
.iconbtn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:#EAF4EE}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.iconbtn .dot{position:absolute;top:4px;right:2px;min-width:19px;height:19px;border-radius:99px;background:var(--leaf);color:var(--ever);font:700 .72rem/19px var(--f-b);text-align:center;padding:0 5px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#05211E;display:grid;place-items:center;font:700 .95rem var(--f-d);text-decoration:none;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
@media(min-width:520px){.brand span{display:inline}.seg button{padding:6px 14px;font-size:.88rem}}
@media(min-width:860px){.primary{display:flex}.btn.hide-sm{display:inline-flex}.tabbar{display:none!important}main{padding-bottom:0!important}}

/* mobile tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ever);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.1)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#B9D3C8;text-decoration:none;font-size:.72rem;font-weight:600;padding:6px 0;border-radius:12px;min-height:50px;justify-content:center}
.tabbar a[aria-current=page]{color:#fff;background:rgba(255,255,255,.1)}
.tabbar a.fab{color:var(--ever)}
.tabbar a.fab .fabc{width:46px;height:46px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;margin-top:-20px;border:4px solid var(--ever)}
.tabbar a.fab span.t{color:#CFE3D8}
main{display:block;padding-bottom:96px;outline:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:2px solid transparent;font:700 1rem var(--f-b);text-decoration:none;cursor:pointer;transition:background .15s,transform .1s;color:inherit}
.btn:active{transform:translateY(1px)}
.btn-leaf{background:var(--leaf);color:var(--ever)}
.btn-leaf:hover{background:#82D285}
.btn-primary{background:var(--teal-d);color:#fff}
.btn-primary:hover{background:#0B645E}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--ink)}
.btn-ghost:hover{background:var(--soft)}
.btn-light{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn-light:hover{background:rgba(255,255,255,.1)}
.btn-quiet{background:none;color:var(--link);padding:0 10px;min-height:40px}
.btn-sm{min-height:40px;padding:0 14px;font-size:.92rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-block{width:100%}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 8px;border-radius:999px;font:600 .82rem/1.5 var(--f-b);white-space:nowrap}
.chip svg{flex:none}
.st-new{background:var(--new-bg);color:var(--new-fg)}
.st-claimed{background:var(--clm-bg);color:var(--clm-fg)}
.st-progress{background:var(--prg-bg);color:var(--prg-fg)}
.st-resolved{background:var(--res-bg);color:var(--res-fg)}
.chip-cat{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* generic blocks */
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,24px)}
.block h2{font-size:1.25rem}
.page-head{padding:clamp(24px,4vw,44px) 0 18px}
.page-head h1{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:.3em}
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
section.sec{padding:clamp(36px,6vw,72px) 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{margin:0}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.92rem;color:var(--muted)}
.note svg{margin-top:2px;color:var(--teal-d)}
.note p{margin:0}
.empty{text-align:center;padding:36px 20px;border:2px dashed var(--line2);border-radius:14px;color:var(--muted)}
.empty h3{color:var(--ink)}
.empty svg{color:var(--teal-d);margin-bottom:6px}

/* hero */
.hero{background:var(--ever);color:#EAF4EE;position:relative;overflow:hidden}
.hero .wrap{display:grid;gap:32px;padding-top:clamp(28px,5vw,64px);padding-bottom:clamp(36px,6vw,72px);align-items:center}
.hero h1{color:#fff;max-width:14ch}
.hero .lead{color:#C4DBD0}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 18px}
.hero .safety{font-size:.88rem;color:#A9C7BA;max-width:52ch;display:flex;gap:8px}
.hero .safety svg{margin-top:2px;flex:none}
.heromap{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.14);aspect-ratio:4/3.3}
.heromap .map{width:100%;height:100%;display:block}
.heropop{position:absolute;left:12px;bottom:12px;right:12px;max-width:340px;background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.55);display:grid;gap:6px}
.heropop strong{font:700 1rem var(--f-d)}
.heropop a{font-weight:700}
@media(min-width:900px){.hero .wrap{grid-template-columns:1fr 1.15fr;gap:48px}}

.statline{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.statline>div{background:var(--card);padding:16px 18px}
.statline b{display:block;font:800 clamp(1.5rem,3.4vw,2.1rem)/1.1 var(--f-d)}
.statline span{font-size:.9rem;color:var(--muted)}
@media(min-width:760px){.statline{grid-template-columns:repeat(4,1fr)}}
.tag-demo{display:inline-block;font-size:.78rem;font-weight:600;color:var(--muted);border:1px dashed var(--line2);border-radius:99px;padding:2px 10px}

.twocol{display:grid;gap:20px}
@media(min-width:800px){.twocol{grid-template-columns:1fr 1fr}}
.steps-list{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:16px}
.steps-list li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:12px}
.steps-list li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--ever);color:#fff;display:grid;place-items:center;font:700 1rem var(--f-d)}
.steps-list strong{display:block}
.steps-list p{margin:0;color:var(--muted)}

.statusflow{display:grid;gap:0;margin:0;padding:0;list-style:none}
.statusflow li{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.statusflow li:first-child{border-top:0}
.statusflow p{margin:0;color:var(--muted)}
@media(min-width:800px){.statusflow{grid-template-columns:repeat(4,1fr);gap:20px}.statusflow li{grid-template-columns:1fr;border-top:0;border-left:3px solid var(--line2);padding:2px 0 2px 16px}}

/* issue cards */
.cards{display:grid;gap:12px}
@media(min-width:760px){.cards.cols{grid-template-columns:repeat(3,1fr)}}
.icard{display:grid;grid-template-columns:84px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.icard:hover,.icard.active{border-color:var(--teal-d)}
.icard.active{box-shadow:0 0 0 2px var(--teal-d)}
.thumb{width:84px;height:84px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--teal-d)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.icard h3{font-size:1.02rem;margin:0 0 6px;line-height:1.25}
.icard .meta{font-size:.86rem;color:var(--muted);margin:6px 0 0}
.icard .chips{gap:6px}
.baf{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:10px;overflow:hidden}
.baf img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
.done{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:var(--ink)}
.done:hover{border-color:var(--teal-d)}
.done h3{margin:0;font-size:1.02rem}
.done p{margin:0;font-size:.9rem;color:var(--muted)}
.cap{font-size:.78rem;color:var(--muted)}

/* solve page */
.filters{display:grid;gap:12px;margin-bottom:16px}
.frow{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.frow{grid-template-columns:2fr 1fr 1fr}}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchips button,.seg2 button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);font:600 .92rem var(--f-b);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchips button[aria-pressed=true]{background:var(--ever);color:#fff;border-color:var(--ever)}
:root[data-theme="dark"] .fchips button[aria-pressed=true]{background:var(--teal-d);border-color:var(--teal-d)}
.seg2{display:inline-flex;gap:0;border:1.5px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--card)}
.seg2 button{border:0;border-radius:0}
.seg2 button[aria-pressed=true]{background:var(--ever);color:#fff}
.split{display:grid;gap:16px}
.split[data-view=list] .mapcol{display:none}
.split[data-view=map] .listcol{display:none}
@media(min-width:1024px){.split{grid-template-columns:minmax(360px,440px) 1fr;gap:20px;align-items:start}.split[data-view] .mapcol,.split[data-view] .listcol{display:block}.viewtoggle{display:none}
  .listcol{max-height:calc(100vh - 250px);overflow:auto;padding-right:6px}.mapcol{position:sticky;top:84px}.mapbox{height:calc(100vh - 250px)!important;min-height:480px}}
.mapbox{position:relative;border-radius:18px;overflow:hidden;background:var(--map);height:min(66vh,560px);min-height:340px;border:1px solid var(--line)}
.mapbox .map{width:100%;height:100%;display:block;touch-action:manipulation}
.zoom{position:absolute;top:10px;right:10px;display:grid;gap:6px}
.zoom button{width:42px;height:42px;border-radius:10px;border:0;background:var(--card);color:var(--ink);font:700 1.2rem var(--f-b);cursor:pointer;display:grid;place-items:center}
.pop{position:absolute;left:10px;right:62px;bottom:10px;background:var(--card);color:var(--ink);border-radius:14px;padding:12px;display:grid;gap:6px;box-shadow:0 14px 36px -12px rgba(0,0,0,.6)}
.pop strong{font:700 1rem var(--f-d)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted);margin:0 0 10px;padding:0;list-style:none}
.legend li{display:inline-flex;gap:6px;align-items:center}
.count{font-weight:600;margin:0 0 10px}
.pin{cursor:pointer}
.pin .fring{display:none}
.pin:focus{outline:none}
.pin:focus-visible .fring{display:block}
.pin .pin-in{transform-box:fill-box;transform-origin:50% 100%;transition:transform .15s}
.pin.hl .pin-in,.pin:hover .pin-in{transform:scale(1.18)}
.pin.sel .pin-in{transform:scale(1.28)}
.pin .halo{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:2}
.anim .pin-in{animation:drop .55s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:var(--d,0ms)}
@keyframes drop{from{opacity:0;transform:translateY(-34px)}}
.ml{fill:#4D6B5A;font:600 11px var(--f-b);paint-order:stroke;stroke:#EAF3EC;stroke-width:3px;stroke-linejoin:round}
.hood{fill:#7FA48E;font:700 20px var(--f-d);letter-spacing:.14em;paint-order:stroke;stroke:#EAF3EC;stroke-width:4px}

/* forms */
.field{margin-bottom:18px}
.field>label,.field>legend,fieldset legend{font-weight:700;display:block;margin-bottom:6px;padding:0}
fieldset{border:0;padding:0;margin:0 0 18px}
.hint{font-size:.88rem;color:var(--muted);margin:4px 0 0}
.in{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
textarea.in{min-height:110px;resize:vertical}
.in:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.in[aria-invalid=true]{border-color:var(--red);background:var(--red-bg)}
.err{display:flex;gap:6px;align-items:flex-start;color:var(--red);font-weight:600;font-size:.9rem;margin:6px 0 0}
.ok{display:flex;gap:10px;align-items:flex-start;background:var(--res-bg);color:var(--res-fg);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:16px}
.bad{display:flex;gap:10px;align-items:flex-start;background:var(--red-bg);color:var(--red);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:16px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:4px;min-height:40px}
.opts{display:grid;gap:10px}
@media(min-width:560px){.opts.c3{grid-template-columns:repeat(3,1fr)}.opts.c2{grid-template-columns:1fr 1fr}}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--card);cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt:has(input:checked){border-color:var(--teal-d);box-shadow:0 0 0 2px var(--teal-d);background:var(--soft)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.opt .oi{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--teal-d);flex:none}
.opt b{display:block}
.opt small{color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--teal-d);flex:none}

/* report flow */
.rwrap{max-width:760px;margin:0 auto}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;padding:0;margin:0 0 22px}
.stepper li{border-top:5px solid var(--line);padding-top:8px;font-size:.84rem;font-weight:600;color:var(--muted)}
.stepper li.done{border-color:var(--teal-d);color:var(--ink)}
.stepper li[aria-current=step]{border-color:var(--leaf);color:var(--ink)}
.stepper .n{display:none}
@media(min-width:560px){.stepper .n{display:inline}}
.rfoot{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.pickmap{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line2);background:var(--map);height:min(52vh,420px);min-height:300px}
.pickmap:focus-visible{outline:3px solid var(--focus)}
.pickmap .map{width:100%;height:100%;display:block;cursor:crosshair}
.pickmap.mini{height:200px;min-height:0;pointer-events:none}
.locrow{display:grid;gap:10px;margin:14px 0}
@media(min-width:620px){.locrow{grid-template-columns:auto 1fr;align-items:end}}
.photoui .pprev{margin-bottom:10px}
.photoui .pprev img{max-height:230px;border-radius:12px;display:block}
.photoui .row{display:flex;flex-wrap:wrap;gap:10px}
.filebtn{position:relative}
.filebtn input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%}
.filebtn:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.review{display:grid;gap:0;margin:0 0 16px}
.review>div{display:grid;grid-template-columns:110px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.review dt{font-weight:700;color:var(--muted)}
.review dd{margin:0}
.success{text-align:center;padding:12px 0}
.success .big{width:72px;height:72px;border-radius:50%;background:var(--res-bg);color:var(--res-fg);display:grid;place-items:center;margin:0 auto 14px}

/* detail */
.crumbs{padding:18px 0 4px}
.dgrid{display:grid;gap:16px;grid-template-areas:"actions" "main" "side";padding-bottom:40px}
@media(min-width:960px){.dgrid{grid-template-columns:1.6fr 1fr;grid-template-areas:"main actions" "main side";align-items:start}}
.dmain{grid-area:main;display:grid;gap:16px}
.dactions{grid-area:actions}
.dside{grid-area:side;display:grid;gap:16px}
.dhead h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:10px 0 8px}
.meta{color:var(--muted)}
.photos{display:grid;gap:12px}
@media(min-width:560px){.photos{grid-template-columns:1fr 1fr}}
.photos figure{margin:0}
.photos img{width:100%;border-radius:12px;display:block;aspect-ratio:3/2;object-fit:cover;background:var(--soft)}
.photos figcaption{font-size:.84rem;color:var(--muted);margin-top:4px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative;padding-bottom:20px}
.timeline li:not(:last-child)::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line)}
.tdot{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--teal-d);border:1.5px solid var(--line2)}
.timeline p{margin:0 0 4px}
.timeline .th{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.timeline time{font-size:.84rem;color:var(--muted)}
.timeline img{max-width:260px;width:100%;border-radius:10px;margin-top:6px;display:block}
.actions-col{display:grid;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(4,22,19,.62)}
.dlg{padding:22px;overflow:auto;max-height:90vh}
.dlg h2{font-size:1.4rem;padding-right:40px}
.dlg .x{position:absolute;right:10px;top:10px;width:44px;height:44px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--ink);display:grid;place-items:center}
.dlg .x:hover{background:var(--soft)}
.dlg .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}

/* profile */
.phead{background:var(--ever);color:#EAF4EE;border-radius:20px;padding:clamp(18px,3vw,28px);display:grid;gap:18px;margin-top:20px}
.phead .who{display:flex;gap:16px;align-items:center}
.phead .avatar{width:72px;height:72px;font-size:1.6rem}
.phead h1{font-size:clamp(1.5rem,3.4vw,2rem);color:#fff;margin:0 0 4px}
.phead .chip{background:rgba(255,255,255,.14);color:#fff}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pstats div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.pstats b{display:block;font:800 1.5rem var(--f-d);color:#fff}
.pstats span{font-size:.84rem;color:#B9D3C8}
@media(min-width:800px){.phead{grid-template-columns:1.2fr 1fr;align-items:center}}
.tabs{display:flex;gap:6px;margin:22px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:12px 16px;text-decoration:none;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;white-space:nowrap}
.tabs a[aria-selected=true]{color:var(--ink);border-color:var(--leaf)}
.badges{display:grid;gap:10px}
@media(min-width:600px){.badges{grid-template-columns:1fr 1fr}}
.badge{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.badge .bi{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--res-bg);color:var(--res-fg)}
.badge.locked{border-style:dashed;background:transparent}
.badge.locked .bi{background:var(--soft);color:var(--muted)}
.badge p{margin:0;font-size:.88rem;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist p{margin:0}
.grid2{display:grid;gap:16px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile b{display:block;font:800 1.8rem/1.1 var(--f-d)}
.tile span{color:var(--muted);font-size:.9rem}

/* notifications */
.nlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.nitem a{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.nitem a:hover{border-color:var(--teal-d)}
.nitem.unread a{border-left:6px solid var(--leaf)}
.nitem .ni{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--teal-d)}
.nitem b{display:block}
.nitem small{color:var(--muted)}
.unrd{font-size:.78rem;font-weight:700;background:var(--leaf);color:var(--ever);border-radius:99px;padding:2px 9px}

/* impact */
.chartbox{overflow-x:auto}
.chartbox svg{min-width:520px;width:100%;height:auto}
.bar-r{fill:var(--bar-a);stroke:var(--bar-b);stroke-width:1.5}
.bar-s{fill:var(--bar-b)}
.axis{stroke:var(--line);stroke-width:1}
.axt{fill:var(--muted);font:12px var(--f-b)}
.key{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 0;font-size:.9rem}
.key i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.prog{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--teal-d)}
table.dt{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:10px}
table.dt th,table.dt td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
details summary{cursor:pointer;font-weight:600;padding:8px 0}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:10px}
.feed li:first-child{border-top:0}
.feed p{margin:0}

/* auth */
.authgrid{display:grid;gap:28px;padding:clamp(24px,5vw,56px) 0}
@media(min-width:900px){.authgrid{grid-template-columns:1fr 1fr;align-items:start}}
.authgrid .intro ul{padding-left:0;list-style:none;display:grid;gap:12px}
.authgrid .intro li{display:flex;gap:12px}
.authtabs{display:flex;gap:6px;margin-bottom:18px}
.authtabs a{flex:1;text-align:center;padding:11px;border-radius:10px;text-decoration:none;font-weight:700;border:1.5px solid var(--line2);color:var(--ink)}
.authtabs a[aria-current=page]{background:var(--ever);color:#fff;border-color:var(--ever)}
:root[data-theme="dark"] .authtabs a[aria-current=page]{background:var(--teal-d);border-color:var(--teal-d)}
.rules{list-style:none;margin:6px 0 0;padding:0;font-size:.88rem;color:var(--muted)}
.rules li.met{color:var(--res-fg);font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap}

footer.foot{background:var(--ever);color:#B9D3C8;padding:36px 0 48px;margin-top:20px}
footer.foot a{color:#DFF3E7}
footer.foot .cols{display:grid;gap:20px}
@media(min-width:800px){footer.foot .cols{grid-template-columns:1.4fr 1fr 1fr}}
footer.foot h2{font-size:1rem;color:#fff}
footer.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ever);color:#fff;border:1px solid rgba(255,255,255,.2);padding:12px 18px;border-radius:12px;font-weight:600;max-width:min(480px,calc(100vw - 24px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:860px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


/* ===== Dashboard look: navy sidebar, lime + white ===== */
:root{--shadow:0 12px 36px #0a20110a}
body{font-size:15px;background:#fff}
body,.demo{letter-spacing:-.003em}
h1,h2,h3{letter-spacing:-.02em}
h1,h2,h3,.brand,.statline b,.tile b,.pstats b{font-family:var(--f-d)}
.demo{background:#06201C;color:#9FB8AC;border-bottom:1px solid #17322D}
.top{background:var(--ever);border-bottom:1px solid #17322D}
.primary a{color:#AEBDB6}
.primary a:hover,.primary a[aria-current=page]{background:#17322D;color:#D9FFB1}
.seg{background:#102A25;border:1px solid #28453D}
.seg button[aria-pressed=true]{background:var(--leaf);color:#153023}
.rolechip{background:#102A25;border:1px solid #28453D;color:#D9FFB1}
.iconbtn .dot{background:#FF7C5C;color:#fff}
.avatar{background:#F4C7A8;color:#704829}
.tabbar a[aria-current=page]{background:#17322D;color:#D9FFB1}
.tabbar a.fab .fabc{background:var(--leaf)}

.btn{border-radius:12px}
.btn-leaf{background:var(--leaf);color:#153225}
.btn-leaf:hover{background:#BCF78A}
.btn-primary{background:var(--ever);color:#D9FFB1}
.btn-primary:hover{background:#102A25}
.btn-ghost{background:#fff;border-color:#D5DFD6}
.btn-light{background:#17352E;border-color:#35544A;color:#fff}
.btn-light:hover{background:#1E4339}

.hero::after{content:"";position:absolute;width:430px;height:430px;border-radius:50%;border:1px solid #28564C;right:6%;top:-230px;box-shadow:0 0 0 32px #15352F,0 0 0 33px #28564C,0 0 0 78px #15352F,0 0 0 79px #28564C;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero{border-radius:0 0 28px 28px}
.hero h1{letter-spacing:-.03em}
.heromap{border:1px solid #28564C;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}

.block,.icard,.done,.tile,.badge,.nitem a,.statline,.pop,.zoom button,.mapbox,.pickmap{box-shadow:var(--shadow);border-color:var(--line)}
.block,.icard,.done,.statline{border-radius:17px}
.icard:hover,.done:hover,.nitem a:hover{border-color:#A9D9BB}
.steps-list li::before{background:var(--ever);color:var(--leaf)}
.fchips button[aria-pressed=true],.seg2 button[aria-pressed=true],.authtabs a[aria-current=page]{background:var(--ever);border-color:var(--ever);color:#D9FFB1}
.stepper li[aria-current=step]{border-color:var(--leaf)}
.unrd{background:var(--leaf);color:#153023}
.nitem.unread a{border-left-color:var(--leaf)}
.chip-cat{background:#fff}
a{color:var(--link)}
.phead{background:var(--ever);position:relative;overflow:hidden}
.phead::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;border:1px solid #28564C;right:-60px;top:-160px;box-shadow:0 0 0 28px #15352F,0 0 0 29px #28564C;pointer-events:none}
.phead>*{position:relative;z-index:1}
.phead .avatar{background:#F4C7A8;color:#704829}
footer.foot{background:var(--ever);color:#9FB8AC}
footer.foot a{color:#D9FFB1}
footer.foot h2{color:#fff}
#toast{background:var(--ever);color:#D9FFB1}

/* desktop: header becomes the left sidebar */
@media(min-width:860px){
  .demo,main{margin-left:236px}
  .top{position:fixed;left:0;top:0;bottom:0;width:236px;border-bottom:0;border-right:1px solid #17322D;overflow-y:auto}
  .top .wrap{padding:0;height:100%;max-width:none}
  .bar{flex-direction:column;align-items:stretch;gap:0;height:100%;min-height:0;padding:27px 17px}
  .brand{margin:0 9px 37px}
  .primary{flex-direction:column;margin:0;gap:5px}
  .primary::before{content:"Workspace";font:600 10px var(--f-b);text-transform:uppercase;letter-spacing:1.4px;color:#748B82;padding:0 12px;margin-bottom:7px}
  .primary a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;font-size:.9rem}
  .primary a::before{content:"⌂";width:19px;text-align:center;font-size:17px}
  .primary a[data-r=solve]::before{content:"⌖"}
  .primary a[data-r=impact]::before{content:"▥"}
  .tools{margin:auto 0 0;padding-top:16px;border-top:1px solid #234039;flex-wrap:wrap;gap:10px}
  .tools .seg{width:100%}.tools .seg button{flex:1}
  .tools .btn{width:100%;order:3}
  .mapcol{top:20px}
}

/* map-first hero */
main h1:focus{outline:none}
.hero{background:#EAF3EC;min-height:clamp(560px,calc(100vh - 110px),780px);display:flex;align-items:center;border-radius:0;border-bottom:1px solid var(--line)}
.hero::after{display:none}
.hero .heromap{position:absolute;inset:0;border:0;border-radius:0;box-shadow:none;aspect-ratio:auto}
.hero .heromap .map{width:100%;height:100%}
.hero .wrap{display:block;padding-top:40px;padding-bottom:40px;pointer-events:none}
.hero .hp{pointer-events:auto;max-width:470px;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,3vw,34px);box-shadow:0 30px 70px -30px rgba(7,27,25,.4)}
.hero h1{color:var(--ever);font-size:clamp(1.9rem,3.2vw,2.7rem);max-width:none;letter-spacing:-.03em}
.hero .lead,.hero .safety{color:var(--muted)}
.hero .btn-light{background:#fff;border-color:#BCD1C3;color:var(--ever)}
.hero .btn-light:hover{background:var(--soft)}
.heropop{left:auto;right:24px;bottom:24px;max-width:320px}
@media(max-width:859px){
  .hero{display:block;min-height:0}
  .hero .heromap{position:relative;height:320px}
  .hero .wrap{pointer-events:auto;padding-top:16px;padding-bottom:24px}
  .hero .hp{max-width:none}
  .heropop{left:12px;right:12px;bottom:12px;max-width:none}
}

/* map on top, nothing covering it; text sits below */
.hero{display:block;min-height:0;background:#fff}
.hero .heromap{position:relative;inset:auto;height:clamp(420px,68vh,640px);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;gap:24px;align-items:start;padding-top:32px;padding-bottom:40px;pointer-events:auto}
@media(min-width:900px){.hero .wrap{grid-template-columns:1.3fr 1fr}}
.hero .hp{background:none;border:0;box-shadow:none;padding:0;max-width:640px;-webkit-backdrop-filter:none;backdrop-filter:none}
.hero .heropop{position:static;max-width:none;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}

/* logo */
.brand{display:block}
.brand .logo{display:block;height:50px;width:50px;object-fit:contain;background:#fff;border-radius:14px;padding:2px}
@media(min-width:860px){
  .brand{margin:0 0 24px}
  .brand .logo{width:100%;height:auto;aspect-ratio:1;border-radius:20px;padding:6px;box-shadow:0 14px 30px -16px rgba(0,0,0,.6)}
}

/* real map */
.leafmap{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.pickmap .leafmap{position:absolute}
.heromap,.mapbox,.pickmap{isolation:isolate}
.pinicon{background:none!important;border:0!important}
.pinicon .pin{cursor:pointer}
.leaflet-container{font-family:var(--f-b);background:#EAF3EC}
.leaflet-container a{color:var(--link)}
.pop{z-index:1200}
.leaflet-control-zoom a{color:var(--ever)!important}

.locbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 0 12px}
.locname{display:flex;align-items:center;gap:8px;min-width:0;color:var(--ever)}
.locname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locbtns{display:flex;gap:8px;flex-wrap:wrap}
.livedot{width:9px;height:9px;border-radius:50%;background:#2F80ED;box-shadow:0 0 0 3px rgba(47,128,237,.25);display:inline-block}
.btn-primary .livedot{background:#7FD1FF}
.hero .wrap.locwrap{display:block;padding-top:18px;padding-bottom:0}

.dirtools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}
.dirmap{position:relative;height:340px;border-radius:14px;overflow:hidden;isolation:isolate;border:1px solid var(--line)}
.dirsum{margin:12px 0 4px;font-size:1.05rem;color:var(--ever)}
.dsteps{margin:8px 0 0;padding-left:22px;max-height:240px;overflow:auto;display:grid;gap:6px}
.dsteps li::marker{color:var(--teal-d);font-weight:700}

/* splash */
#splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#fff;transition:opacity .5s ease,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
.sp-in{display:grid;justify-items:center;gap:20px;padding:24px;text-align:center}
.sp-logo{position:relative;width:min(240px,62vw);aspect-ratio:1}
.sp-logo img{position:relative;width:100%;height:100%;display:block;animation:spPop .9s cubic-bezier(.2,.9,.3,1.15) both}
.sp-logo i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(47,168,101,.4);animation:spPing 2.4s ease-out infinite}
.sp-logo i:nth-child(2){animation-delay:.8s}.sp-logo i:nth-child(3){animation-delay:1.6s}
.sp-cap{margin:0;color:#52665A;font:500 .95rem var(--f-b);letter-spacing:.01em}
.sp-bar{width:min(240px,62vw);height:6px;border-radius:99px;background:#E3EFE6;overflow:hidden}
.sp-bar span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#1B7F4E,#A9F36D);animation:spFill 3s linear forwards}
@keyframes spPop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes spPing{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.55);opacity:0}}
@keyframes spFill{to{width:100%}}
@media(prefers-reduced-motion:reduce){.sp-logo i,.sp-logo img{animation:none}}
/* profile location */
.locshow{display:flex;align-items:center;gap:8px;margin:0 0 10px;color:var(--ever)}
#profMap{position:relative;border-radius:14px;overflow:hidden;isolation:isolate;border:1px solid var(--line)}

/* live version */
.hero .wrap{grid-template-columns:1fr!important}
.emptybox{grid-column:1/-1;text-align:center;padding:28px 20px;display:grid;justify-items:center;gap:6px}
.emptybox h3{margin:0}.emptybox p{margin:0 0 8px;max-width:46ch}
.baf.nophoto{display:grid;place-items:center;aspect-ratio:16/9;background:var(--soft);color:var(--teal-d);border-radius:12px}
.baf.nophoto .ic{width:34px;height:34px}

function seed(){return {v:3,signedIn:false,mode:'resident',hours:0,extraReported:0,extraResolved:0,flags:[],nextId:1,
  profile:{name:'',email:'',hood:'',roles:['resident','volunteer'],photo:null,prefs:{claimed:true,update:true,resolved:true,milestone:true,near:false}},
  issues:[],notifs:[],nid:1}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===3)return s}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}if(typeof queuePush==='function')queuePush()}
state=load();if(!state.loc)state.loc={lat:10.8155,lng:78.6965,label:'Tiruchirappalli, Tamil Nadu'};

/* ---------- backend (Supabase) ---------- */
const CFG=window.CS_CONFIG||{};
const SB=(window.supabase&&/^https:\/\//.test(CFG.SUPABASE_URL||'')&&CFG.SUPABASE_ANON_KEY&&!/YOUR/.test(CFG.SUPABASE_ANON_KEY))?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
let pushTimer=0,lastSig='';
function queuePush(){if(!SB||!state.uid)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushProfile,700)}
async function pushProfile(){
  if(!SB||!state.uid)return;const p=state.profile;
  const body={name:p.name,roles:p.roles};if(p.photo&&/^https?:/.test(p.photo))body.photo_url=p.photo;
  const set={loc_lat:state.loc.lat,loc_lng:state.loc.lng,loc_label:state.loc.label,prefs:p.prefs};
  const sig=JSON.stringify([body,set]);if(sig===lastSig)return;lastSig=sig;
  try{await SB.from('profiles').update(body).eq('id',state.uid);await SB.from('user_settings').update(set).eq('user_id',state.uid)}catch(e){lastSig=''}}
async function loadProfile(uid){
  try{const a=await SB.from('profiles').select('*').eq('id',uid).maybeSingle(),b=await SB.from('user_settings').select('*').eq('user_id',uid).maybeSingle();
    const pr=a.data,st=b.data;
    if(pr){if(pr.name)state.profile.name=pr.name;if(pr.roles&&pr.roles.length)state.profile.roles=pr.roles;if(pr.photo_url)state.profile.photo=pr.photo_url;
      if(!state.profile.roles.includes(state.mode))state.mode=state.profile.roles[0]}
    if(st){if(st.prefs)state.profile.prefs=Object.assign({},state.profile.prefs,st.prefs);state.hours=+st.hours||0;
      if(st.loc_lat!=null&&st.loc_lng!=null)setLoc(st.loc_lat,st.loc_lng,st.loc_label||'My location',true)}
  }catch(e){}}
async function applySession(sess){
  if(!SB)return;
  if(sess&&sess.user){
    if(state.uid===sess.user.id&&state.signedIn)return;
    state.uid=sess.user.id;state.signedIn=true;state.profile.email=sess.user.email;
    await loadProfile(sess.user.id);save();renderChrome(parseHash().parts[0]||'home');
    if(parseHash().parts[0]!=='auth')rerender();
  }else if(state.uid){state.uid=null;state.signedIn=false;state.profile=seed().profile;save();renderChrome('home')}}

/* ---------- helpers ---------- */
const iss=id=>state.issues.find(i=>i.id===+id);
const short=n=>{const p=String(n||'Neighbor').trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1][0].toUpperCase()+'.':p[0]};
const who=id=>id==='me'?short(state.profile.name):(PPL[id]||'A neighbor');
const whoTag=id=>id==='me'?who(id)+' (you)':who(id);
const initials=n=>String(n||'N').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const rel=ts=>{const m=Math.round((Date.now()-ts)/6e4);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' hr ago';const d=Math.round(h/24);if(d===1)return'yesterday';if(d<7)return d+' days ago';return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
const absT=ts=>new Date(ts).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const timeEl=ts=>`<time datetime="${new Date(ts).toISOString()}" title="${esc(absT(ts))}">${rel(ts)}</time>`;
const distKm=i=>Math.hypot(i.x-HOME.x,i.y-HOME.y)*KM;
const distTxt=i=>distKm(i).toFixed(1)+' km';
function locLabel(x,y){const q=toLL(x,y);return (D.place&&D.px===x&&D.py===y)?D.place:'Pinned location ('+q[0].toFixed(4)+', '+q[1].toFixed(4)+')'}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3800)}
function addNotif(type,issue,text){if(state.profile.prefs[type]===false)return;state.notifs.unshift({id:state.nid++,type,ts:Date.now(),read:false,issue,text})}
function addTL(i,type,text,x){i.timeline.push(Object.assign({ts:Date.now(),who:'me',type,text:text||''},x||{}))}
const photoOf=(i)=>{const t=i.timeline.find(t=>t.type==='reported'&&t.photo);return t?t.photo:null};
const lastAfter=(i)=>{const t=[...i.timeline].reverse().find(t=>(t.photo&&t.photo.startsWith('data:')&&t.type!=='reported'));return t?t.photo:null};


const photoSrc=(p)=>p&&p.startsWith('data:')?p:'';
const altFor=(i,p)=>p==='after'||(p&&p.startsWith('data:')&&false)?`After: ${i.title}`:`Photo for: ${i.title}`;

/* ---------- badges / stats ---------- */
function myStats(){
  const L=state.issues;
  return {reports:L.filter(i=>i.reporter==='me').length,
    claims:L.filter(i=>i.timeline.some(t=>t.who==='me'&&t.type==='claim')).length,
    resolved:L.filter(i=>i.volunteer==='me'&&i.status==='Resolved').length,
    photos:L.reduce((n,i)=>n+i.timeline.filter(t=>t.who==='me'&&t.type!=='reported'&&t.photo).length,0),
    hours:state.hours};
}
const BADGES=[
 {id:'first',role:'resident',ic:'leaf',name:'First report',desc:'Shared your first report.',ok:s=>s.reports>=1,prog:s=>`${Math.min(s.reports,1)} of 1 report`},
 {id:'keen',role:'resident',ic:'eye',name:'Keen eyes',desc:'Shared three reports.',ok:s=>s.reports>=3,prog:s=>`${Math.min(s.reports,3)} of 3 reports`},
 {id:'help',role:'volunteer',ic:'hand',name:'Helping hand',desc:'Claimed your first issue.',ok:s=>s.claims>=1,prog:s=>`${Math.min(s.claims,1)} of 1 issue`},
 {id:'done',role:'volunteer',ic:'check',name:'Finished the job',desc:'Resolved an issue.',ok:s=>s.resolved>=1,prog:s=>`${Math.min(s.resolved,1)} of 1 issue`},
 {id:'photo',role:'volunteer',ic:'camera',name:'Show and tell',desc:'Added a progress or completion photo.',ok:s=>s.photos>=1,prog:s=>`${Math.min(s.photos,1)} of 1 photo`},
 {id:'hours',role:'volunteer',ic:'clock',name:'Time well spent',desc:'Gave 10 volunteer hours.',ok:s=>s.hours>=10,prog:s=>`${Math.min(s.hours,10)} of 10 hours`}];
const earned=()=>{const s=myStats();return BADGES.filter(b=>b.ok(s)).map(b=>b.id)};
function checkMilestones(prev){const now=earned();return now.filter(id=>!prev.includes(id)).map(id=>{const b=BADGES.find(x=>x.id===id);addNotif('milestone',null,'New milestone: '+b.name);return b.name})}
const msTxt=ms=>ms.length?' You reached a milestone: '+ms.join(', ')+'.':'';

/* ---------- map ---------- */
/* ---------- real map (Leaflet + OpenStreetMap data) ---------- */
let C0={lat:state.loc.lat,lng:state.loc.lng};
const KMLAT=111.32,KMLNG=()=>111.32*Math.cos(C0.lat*Math.PI/180);
const toLL=(x,y)=>[C0.lat-(y-HOME.y)*KM/KMLAT,C0.lng+(x-HOME.x)*KM/KMLNG()];
const toXY=ll=>({x:HOME.x+(ll.lng-C0.lng)*KMLNG()/KM,y:HOME.y-(ll.lat-C0.lat)*KMLAT/KM});
function leafMap(el,o){o=o||{};const LF=window.L;
  if(!LF){el.innerHTML='<p class="muted" style="padding:24px">The map couldn’t load. Check your internet connection and refresh the page.</p>';return null}
  const m=LF.map(el,{zoomControl:o.zoomControl!==false,scrollWheelZoom:o.scroll!==false,keyboard:o.keyboard!==false,dragging:o.drag!==false,touchZoom:o.drag!==false,doubleClickZoom:o.drag!==false,boxZoom:false});
  const esri=LF.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri, HERE, Garmin, OpenStreetMap contributors'}).addTo(m);
  let swapped=false;esri.on('tileerror',()=>{if(swapped)return;swapped=true;m.removeLayer(esri);LF.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(m)});
  m.setView(toLL(HOME.x,HOME.y),o.zoom||14);if(o.live!==false&&o.zoomControl!==false)attachLive(m);return m}
function pinIcon(i,o){const g=pinG(i,{sel:o&&o.sel}).replace(`translate(${i.x} ${i.y})`,'translate(20 52)');
  return window.L.divIcon({className:'pinicon',html:`<svg width="40" height="56" viewBox="0 0 40 56" style="overflow:visible">${g}</svg>`,iconSize:[40,56],iconAnchor:[20,52]})}
function addPins(layer,list,o){o=o||{};list.forEach(i=>{const mk=window.L.marker(toLL(i.x,i.y),{icon:pinIcon(i,{sel:o.sel===i.id}),title:i.title,alt:i.title,zIndexOffset:o.sel===i.id?1000:0,riseOnHover:true,keyboard:!!o.onclick}).addTo(layer);if(o.onclick)mk.on('click',()=>o.onclick(i.id))})}
function homeMarker(layer){window.L.circleMarker(toLL(HOME.x,HOME.y),{radius:8,color:'#fff',weight:3,fillColor:'#1B7F4E',fillOpacity:1}).bindTooltip('Your pin').addTo(layer)}
function pickMarker(layer,x,y){window.L.marker(toLL(x,y),{icon:window.L.divIcon({className:'pinicon',html:'<svg width="36" height="44" viewBox="-18 -40 36 44" style="overflow:visible"><path d="M0 0C-6-11-18-17-18-30a18 18 0 1 1 36 0C18-17 6-11 0 0z" fill="#36BC7A" stroke="#fff" stroke-width="3"/><circle cy="-30" r="7" fill="#0B2B26"/></svg>',iconSize:[36,44],iconAnchor:[18,40]}),keyboard:false,interactive:false}).addTo(layer)}
function fitPins(m,list){if(!list.length)return;const pts=list.map(i=>toLL(i.x,i.y));pts.push(toLL(HOME.x,HOME.y));m.fitBounds(pts,{padding:[50,50],maxZoom:16})}
new MutationObserver(()=>{if(!window.L)return;document.querySelectorAll('[data-leaf]:not([data-done])').forEach(el=>{el.dataset.done=1;
  const x=+el.dataset.x,y=+el.dataset.y,m=leafMap(el,{zoomControl:false,scroll:false,drag:false,keyboard:false,zoom:16});if(!m)return;
  m.setView(toLL(x,y),16);const g=window.L.layerGroup().addTo(m);
  if(el.dataset.kind==='pick')pickMarker(g,x,y);else{const i=iss(+el.dataset.id);if(i)addPins(g,[i])}})}).observe(document.body,{childList:true,subtree:true});


/* ---------- location: choose + live tracking ---------- */
const LIVE={on:false,id:null,pos:null,first:false},liveSet=new Set();
function paintLive(o){const LF=window.L;if(!document.body.contains(o.map.getContainer())){liveSet.delete(o);return}
  if(!LIVE.pos){if(o.dot){o.map.removeLayer(o.dot);o.map.removeLayer(o.acc);o.dot=o.acc=null}return}
  const ll=[LIVE.pos.lat,LIVE.pos.lng];
  if(!o.dot){o.acc=LF.circle(ll,{radius:LIVE.pos.acc||30,color:'#2F80ED',weight:1,fillColor:'#2F80ED',fillOpacity:.12,interactive:false}).addTo(o.map);
    o.dot=LF.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#2F80ED',fillOpacity:1}).bindTooltip('You are here').addTo(o.map)}
  else{o.dot.setLatLng(ll);o.acc.setLatLng(ll);o.acc.setRadius(LIVE.pos.acc||30)}}
function attachLive(map){const o={map,dot:null,acc:null};liveSet.add(o);paintLive(o)}
const locBar=()=>`<div class="locbar"><span class="locname">${ic('pin',18)}<b>${esc(state.loc.label)}</b></span><span class="locbtns"><button type="button" class="btn btn-ghost btn-sm" data-setloc>Change location</button><button type="button" class="btn btn-sm ${LIVE.on?'btn-primary':'btn-ghost'}" data-live aria-pressed="${LIVE.on}"><span class="livedot"></span>${LIVE.on?(LIVE.pos?'Live location on':'Finding you…'):'Track live location'}</button></span></div>`;
const refreshLocBars=()=>$$('.locbar').forEach(e=>e.outerHTML=locBar());
function startLive(){
  if(!navigator.geolocation){toast('This browser can’t share your location.');return}
  if(LIVE.on)return;LIVE.on=true;LIVE.first=true;refreshLocBars();
  LIVE.id=navigator.geolocation.watchPosition(pos=>{
    LIVE.pos={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
    liveSet.forEach(paintLive);if(liveHook)liveHook();
    if(LIVE.first){LIVE.first=false;liveSet.forEach(o=>{if(document.body.contains(o.map.getContainer())&&!o.map.getContainer().closest('.pickmap.mini'))o.map.setView([LIVE.pos.lat,LIVE.pos.lng],Math.max(o.map.getZoom(),16))})}
    refreshLocBars()},
  err=>{stopLive();toast(err.code===1?'Location permission was blocked. Allow it in your browser’s address bar and try again.':'We couldn’t find your location.')},
  {enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
function stopLive(){if(LIVE.id!=null)navigator.geolocation.clearWatch(LIVE.id);LIVE.id=null;LIVE.on=false;LIVE.pos=null;liveSet.forEach(paintLive);refreshLocBars();if(liveHook)liveHook()}
function setLoc(lat,lng,label,quiet){const was=state.issues.map(i=>toLL(i.x,i.y));state.loc={lat,lng,label};C0={lat,lng};state.profile.hood=label;
  state.issues.forEach((i,k)=>{const q=toXY({lat:was[k][0],lng:was[k][1]});i.x=q.x;i.y=q.y});save();if(!quiet){rerender();toast('Location set to '+label+'.')}}
async function revName(lat,lng){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&lat=${lat}&lon=${lng}`);const j=await r.json();return j&&j.display_name?shortName(j.display_name):null}catch(e){return null}}
function pickIcon(){return window.L.divIcon({className:'pinicon',html:'<svg width="36" height="44" viewBox="-18 -40 36 44" style="overflow:visible"><path d="M0 0C-6-11-18-17-18-30a18 18 0 1 1 36 0C18-17 6-11 0 0z" fill="#36BC7A" stroke="#fff" stroke-width="3"/><circle cy="-30" r="7" fill="#0B2B26"/></svg>',iconSize:[36,44],iconAnchor:[18,40]})}
function initProfileMap(){
  const w=$('#profMap');if(!w)return;
  const m=leafMap(w,{scroll:false,zoom:15});if(!m)return;
  const mk=window.L.marker([state.loc.lat,state.loc.lng],{icon:pickIcon(),draggable:true,title:'Drag to move your location'}).addTo(m);
  const apply=async ll=>{mk.setLatLng(ll);const nm=$('#plocname');nm.textContent='Finding the place name…';
    const label=(await revName(ll.lat,ll.lng))||('Pinned location ('+ll.lat.toFixed(4)+', '+ll.lng.toFixed(4)+')');
    setLoc(ll.lat,ll.lng,label,true);nm.textContent=label;const h=$('.phead .who p');if(h)h.lastChild.textContent=' '+label;toast('Location updated.')};
  m.on('click',e=>apply(e.latlng));mk.on('dragend',()=>apply(mk.getLatLng()));
  const g=$('#plocgeo');if(g)g.onclick=()=>{if(!navigator.geolocation){toast('This browser can’t share your location.');return}
    g.disabled=true;navigator.geolocation.getCurrentPosition(pos=>{g.disabled=false;const ll={lat:pos.coords.latitude,lng:pos.coords.longitude};m.setView([ll.lat,ll.lng],16);apply(ll)},
      err=>{g.disabled=false;toast(err.code===1?'Location permission was blocked. Allow it in your browser’s address bar.':'We couldn’t get your location.')},{enableHighAccuracy:true,timeout:15000})}}
const shortName=n=>String(n||'').split(',').slice(0,3).join(',').trim();
function openLocDlg(){
  openDlg(`<div class="dlg"><button type="button" class="x" data-close aria-label="Close">${ic('x',22)}</button><h2 id="dlgTitle">Choose your location</h2><p class="muted">Search for your city or area, or use your device’s location.</p>
  <form id="locf" class="row" style="flex-wrap:nowrap;margin-bottom:12px"><div style="flex:1"><label class="vh" for="locq">Search for a place</label><input class="in" id="locq" type="search" autocomplete="off" placeholder="e.g. Coimbatore, Srirangam, Anna Nagar"></div><button class="btn btn-primary">Search</button></form>
  <div id="locres" aria-live="polite" style="margin-bottom:12px"></div>
  <button type="button" class="btn btn-ghost btn-block" id="locgeo">${ic('locate',18)} Use my current location</button></div>`,d=>{
    const res=$('#locres',d);
    $('#locf',d).onsubmit=async e=>{e.preventDefault();const q=$('#locq',d).value.trim();if(!q)return;res.innerHTML='<p class="muted">Searching…</p>';
      try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent(q));const j=await r.json();
        res.innerHTML=j.length?'<ul class="nlist">'+j.map((x,k)=>`<li class="nitem"><a href="#" data-k="${k}"><span class="ni">${ic('pin',22)}</span><span><b>${esc(shortName(x.display_name))}</b><small>${esc(x.display_name)}</small></span></a></li>`).join('')+'</ul>':'<p class="muted">No places found. Try a nearby city or a different spelling.</p>';
        $$('[data-k]',res).forEach(a=>a.onclick=ev=>{ev.preventDefault();const x=j[+a.dataset.k];dlg.close();setLoc(+x.lat,+x.lon,shortName(x.display_name))})}
      catch(err){res.innerHTML='<p class="bad" role="alert">The search couldn’t reach the map service. Check your internet connection and try again.</p>'}};
    $('#locgeo',d).onclick=()=>{const b=$('#locgeo',d);if(!navigator.geolocation){res.innerHTML='<p class="bad">This browser can’t share a location.</p>';return}
      b.disabled=true;res.innerHTML='<p class="muted">Asking your device for its location…</p>';
      navigator.geolocation.getCurrentPosition(async pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;let label='My current location';
        try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&lat=${lat}&lon=${lng}`);const j=await r.json();if(j&&j.display_name)label=shortName(j.display_name)}catch(e){}
        dlg.close();setLoc(lat,lng,label);startLive()},
        err=>{b.disabled=false;res.innerHTML='<p class="bad" role="alert">'+(err.code===1?'Location permission was blocked. Allow it in your browser’s address bar and try again.':'We couldn’t get your location. Try searching for your area instead.')+'</p>'},{enableHighAccuracy:true,timeout:15000})}})}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-setloc]'))openLocDlg();
  const l=e.target.closest('[data-live]');if(l){LIVE.on?stopLive():startLive()}});


/* ---------- directions to a claimed issue ---------- */
let liveHook=null,dirMode='foot';
const fmtDist=m=>m<1000?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km';
const fmtTime=sec=>{const mn=Math.max(1,Math.round(sec/60));return mn<60?mn+' min':Math.floor(mn/60)+' hr '+(mn%60)+' min'};
const DNAME={left:'left','slight left':'slightly left',right:'right','slight right':'slightly right','sharp left':'sharp left','sharp right':'sharp right',uturn:'U-turn'};
function stepText(st){const m=st.maneuver||{},n=st.name?' onto '+st.name:'',mod=m.modifier?(DNAME[m.modifier]||m.modifier):'';
  if(m.type==='arrive')return 'Arrive at the report location';
  if(m.type==='depart')return 'Start'+(st.name?' on '+st.name:'');
  if(m.type==='roundabout'||m.type==='rotary')return 'Take the roundabout'+n;
  if(!mod||m.modifier==='straight')return 'Continue straight'+n;
  return 'Turn '+mod+n}
function dirHTML(i){
  if(i.volunteer!=='me'||!(i.status==='Claimed'||i.status==='In Progress'))return '';
  return `<section class="block" id="dirsec" aria-labelledby="dirh"><h2 id="dirh">Directions to the issue</h2><p class="muted" style="margin-top:0">${esc(i.place)}</p>${locBar()}
  <div class="dirtools"><div class="seg2" role="group" aria-label="Travel mode"><button type="button" data-dmode="foot" aria-pressed="${dirMode==='foot'}">Walking</button><button type="button" data-dmode="car" aria-pressed="${dirMode==='car'}">Driving</button></div><a class="btn btn-primary" id="gmaps" target="_blank" rel="noopener" href="#">${ic('pin',18)} Open in Google Maps</a></div>
  <div class="dirmap" id="dirMap"></div><p class="dirsum" id="dirsum" aria-live="polite">Finding the best route…</p><ol class="dsteps" id="dsteps"></ol></section>`}
function initDirections(i){
  const box=$('#dirMap');if(!box)return;
  const m=leafMap(box,{scroll:false});if(!m){$('#dirsum').textContent='The map needs an internet connection.';return}
  const g=window.L.layerGroup().addTo(m),dest=toLL(i.x,i.y);let lastKey='',lastA=null,timer=0,seq=0;
  const startPt=()=>LIVE.pos?[LIVE.pos.lat,LIVE.pos.lng]:[state.loc.lat,state.loc.lng];
  const hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 12742e3*Math.asin(Math.sqrt(h))};
  async function draw(force){
    const a=startPt(),key=dirMode+'|'+(LIVE.pos?'live':'set');
    if(!force&&key===lastKey&&lastA&&hav(a,lastA)<80)return;
    lastKey=key;lastA=a;const my=++seq;g.clearLayers();
    $('#gmaps').href=`https://www.google.com/maps/dir/?api=1&destination=${dest[0]},${dest[1]}&travelmode=${dirMode==='foot'?'walking':'driving'}${LIVE.pos?`&origin=${a[0]},${a[1]}`:''}`;
    if(!LIVE.pos)window.L.circleMarker(a,{radius:9,color:'#fff',weight:3,fillColor:'#1B7F4E',fillOpacity:1}).bindTooltip('Your set location').addTo(g);
    addPins(g,[i],{sel:i.id});
    $('#dirsum').textContent='Finding the best route…';$('#dsteps').innerHTML='';
    try{
      const r=await fetch(`https://routing.openstreetmap.de/routed-${dirMode}/route/v1/driving/${a[1]},${a[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&steps=true`);
      const j=await r.json();if(my!==seq)return;if(!j.routes||!j.routes[0])throw 0;
      const rt=j.routes[0],pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);

/* ---------- impact ---------- */
function chartHTML(){
  const wk=ts=>{const k=11-Math.floor((Date.now()-ts)/(7*864e5));return k>=0&&k<=11?k:-1};const rep=Array(12).fill(0),res=Array(12).fill(0);
  state.issues.forEach(i=>{const a=wk(i.reportedAt);if(a>=0)rep[a]++;if(i.status==='Resolved'){const b=wk(i.timeline[i.timeline.length-1].ts);if(b>=0)res[b]++}});
  const W=640,Hh=280,m={l:38,r:8,t:12,b:36},n=12,gw=(W-m.l-m.r)/n,bw=gw*.34,max=Math.max(5,Math.ceil(Math.max(...rep,...res)/5)*5),y=v=>Hh-m.b-(v/max)*(Hh-m.t-m.b);
  const lab=k=>new Date(Date.now()-(11-k)*7*864e5).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  let g='';for(let t=0;t<=max;t+=max/5)g+=`<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}"/><text class="axt" x="${m.l-8}" y="${y(t)+4}" text-anchor="end">${t}</text>`;
  const bars=rep.map((v,k)=>{const x0=m.l+k*gw+gw*.12;return `<rect class="bar-r" x="${x0}" y="${y(v)}" width="${bw}" height="${Hh-m.b-y(v)}" rx="3"/><rect class="bar-s" x="${x0+bw+3}" y="${y(res[k])}" width="${bw}" height="${Hh-m.b-y(res[k])}" rx="3"/>${k%2?`<text class="axt" x="${x0+bw}" y="${Hh-12}" text-anchor="middle">${lab(k)}</text>`:''}`}).join('');
  const sum=`In the last 12 weeks, ${rep.reduce((a,b)=>a+b,0)} reports were made and ${res.reduce((a,b)=>a+b,0)} were resolved.`;
  return {svg:`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-labelledby="ct cd"><title id="ct">Reports and resolved issues per week, last 12 weeks</title><desc id="cd">${esc(sum)}</desc>${g}${bars}</svg>`,sum,rep,res,lab};
}
VIEWS.impact=function(){
  const t=totals(),c=chartHTML(),rate=t.rep?Math.round(t.res/t.rep*100):0;

  <div class="block" style="margin-bottom:16px"><h2>Contributions over time</h2><p class="muted">Reports and resolved issues per week.</p><div class="chartbox">${c.svg}</div><div class="key"><span><i style="background:var(--bar-a);border:1.5px solid var(--bar-b)"></i>Reported</span><span><i style="background:var(--bar-b)"></i>Resolved</span></div><p style="margin-top:12px">${esc(c.sum)}</p>
  <details><summary>View the chart data as a table</summary><table class="dt"><thead><tr><th>Week of</th><th>Reported</th><th>Resolved</th></tr></thead><tbody>${c.rep.map((v,k)=>`<tr><td>${c.lab(k)}</td><td>${v}</td><td>${c.res[k]}</td></tr>`).join('')}</tbody></table></details></div>
  <div class="grid2"><div class="block"><h2>Resolution rate</h2><p class="muted">${t.res} of ${t.rep} reports have been resolved.</p><div class="prog" role="img" aria-label="${rate} percent of reports resolved"><i style="width:${rate}%"></i></div><p style="margin-top:8px"><b>${rate}%</b> resolved</p></div>
  <div class="block"><h2>Recent activity</h2><ul class="feed">${feed.length?'':'<li class="muted">No activity yet.</li>'}${feed.slice(0,6).map(({e,i})=>`<li>${e.type==='status'?sIcon(e.status,20):ic({reported:'flag',claim:'hand',release:'undo',note:'note'}[e.type],20)}<div><p><strong>${esc(who(e.who))}</strong> ${e.type==='claim'?'claimed':e.type==='status'?'moved to '+e.status:e.type==='release'?'released':e.type==='reported'?'reported':'updated'} <a href="#/issue/${i.id}">${esc(i.title)}</a></p><small class="muted">${timeEl(e.ts)}</small></div></li>`).join('')}</ul></div></div>

};
