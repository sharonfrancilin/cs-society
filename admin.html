<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071B19">
<title>Admin · CS Society</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ever:#071B19;--ever2:#102A25;--leaf:#A9F36D;--teal-d:#1B7F4E;
  --paper:#F6FAF6;--card:#FFFFFF;--ink:#10231A;--muted:#52665A;--line:#E3EBE4;--line2:#AFC4B6;--soft:#F2F8F1;
  --focus:#1B7F4E;--link:#1B7F4E;--red:#A12F22;--red-bg:#F8DDD7;--amber:#7A4B00;
  --new-bg:#FBEBC4;--new-fg:#6B4200;--clm-bg:#D2EFEC;--clm-fg:#0A5A56;--prg-bg:#DDF1CF;--prg-fg:#255C1B;--res-bg:#CFE8D6;--res-fg:#12482A;
  --bar-a:#BFE3DF;--bar-b:#0E766F;--grid:#DCE6DE;
  --shadow:0 1px 2px rgba(7,27,25,.06),0 8px 24px -16px rgba(7,27,25,.18);
  --f-d:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;--f-b:'Inter','Segoe UI',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#061815;--card:#0E2B26;--ink:#E7F0EA;--muted:#A9BDB3;--line:#21443C;--line2:#4C7066;--soft:#123630;
  --focus:#8DE7DB;--link:#8DE7DB;--red:#FF9C8C;--red-bg:#4A1E19;--amber:#F0C46A;
  --new-bg:#4B3606;--new-fg:#FFE0A0;--clm-bg:#0F4743;--clm-fg:#A8F0E8;--prg-bg:#1E4217;--prg-fg:#C5F0B0;--res-bg:#1B4A30;--res-fg:#BFEBCC;
  --bar-a:#2C6D66;--bar-b:#8DE7DB;--grid:#21443C;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 .97rem/1.5 var(--f-b);min-height:100vh}
h1,h2,h3{font-family:var(--f-d);line-height:1.15;letter-spacing:-.012em;margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(1.6rem,3.2vw,2.15rem);font-weight:800}
h2{font-size:1.1rem}h3{font-size:1rem}
p{margin:0 0 1em}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.side :focus-visible{outline-color:#B5F5CC}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
table.vh{min-width:0}.vh th,.vh td{padding:0;border:0}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ic{flex:none;vertical-align:-.2em}
.skip{position:absolute;left:12px;top:-60px;background:var(--leaf);color:var(--ever);padding:10px 14px;border-radius:10px;font-weight:700;z-index:100}
.skip:focus{top:12px}

/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--ever);color:#CFE3D8;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:18px;overflow:auto}
.logo{display:block;width:112px;border-radius:16px;background:#fff;margin:0 auto 2px}
.adm{font:700 .78rem var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:#8FB5A5;text-align:center;margin:8px 0 0}
#nav{display:grid;gap:3px}
#nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#CFE3D8;text-decoration:none;font-weight:600}
#nav a:hover{background:rgba(255,255,255,.07);color:#fff}
#nav a[aria-current=page]{background:rgba(255,255,255,.13);color:#fff}
#nav .n{margin-left:auto;background:#F2B544;color:#3B2600;border-radius:999px;font:800 .75rem var(--f-b);padding:1px 8px;min-width:22px;text-align:center}
.side .foot{margin-top:auto;display:grid;gap:8px}
.side .sbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:none;color:#fff;font-weight:600;text-decoration:none;cursor:pointer}
.side .sbtn:hover{background:rgba(255,255,255,.1)}
main{min-width:0;padding:clamp(18px,3vw,36px);max-width:1280px;width:100%}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.mhead p{margin:0;color:var(--muted)}
#ptitle{display:inline-block}
.mhead .src{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.src i{width:9px;height:9px;border-radius:50%;background:#2F9E63;display:inline-block}
.src i.off{background:#E8A92E}
@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;overflow-x:auto}
  .logo{width:46px;margin:0;border-radius:10px;flex:none}.adm{display:none}
  #nav{display:flex;gap:4px}
  #nav a{padding:9px 12px;white-space:nowrap}
  .side .foot{margin:0 0 0 auto;display:flex;flex:none}
  .side .sbtn{padding:0 12px}
  .side .sbtn span{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:2px solid transparent;font-weight:700;text-decoration:none;cursor:pointer;background:none;transition:background .15s}
.btn-sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn-primary{background:var(--teal-d);color:#fff}.btn-primary:hover{background:#0B645E}
.btn-ghost{border-color:var(--line2);color:var(--ink)}.btn-ghost:hover{background:var(--soft)}
.btn-danger{border-color:var(--red);color:var(--red)}.btn-danger:hover{background:var(--red-bg)}
.btn-danger.armed{background:var(--red);color:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:700}
.lnk:hover{color:var(--link);text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,2vw,20px);box-shadow:var(--shadow);min-width:0}
.panel>h2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.empty{text-align:center;padding:28px 16px;border:2px dashed var(--line2);border-radius:12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 1.05rem var(--f-d);margin-bottom:4px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--new-bg);color:var(--new-fg);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:16px}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.strip>*{padding:16px 18px;border-left:1px solid var(--line);text-decoration:none;color:inherit;display:block;min-width:0}
.strip>*:first-child{border-left:0}
.strip b{display:block;font:800 2rem/1.05 var(--f-d);letter-spacing:-.02em}
.strip span{display:block;font-weight:600;margin-top:4px}
.strip small{display:block;color:var(--muted);margin-top:2px}
.strip a:hover{background:var(--soft)}
.strip .hot b{color:var(--red)}
@media(max-width:1000px){.strip{grid-template-columns:repeat(2,1fr)}.strip>*{border-top:1px solid var(--line)}.strip>*:nth-child(odd){border-left:0}.strip>*:nth-child(-n+2){border-top:0}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 7px;border-radius:999px;font-weight:600;font-size:.8rem;white-space:nowrap}
.st-new{background:var(--new-bg);color:var(--new-fg)}.st-claimed{background:var(--clm-bg);color:var(--clm-fg)}
.st-progress{background:var(--prg-bg);color:var(--prg-fg)}.st-resolved{background:var(--res-bg);color:var(--res-fg)}
.chip-cat{background:var(--soft);color:var(--ink);border:1px solid var(--line)}

/* attention */
.alist{list-style:none;margin:0;padding:0;display:grid}
.alist li{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.alist li:first-child{border-top:0;padding-top:2px}
.alist .t{min-width:0;flex:1 1 260px}
.alist .t b{display:block}
.why{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;margin-top:2px}
.why.flag{color:var(--red)}.why.stale{color:var(--amber)}.why.wait{color:var(--clm-fg)}
.alist small{color:var(--muted);display:block}

/* bars */
.hbar{display:grid;grid-template-columns:minmax(0,150px) 1fr 28px;gap:10px;align-items:center;margin:8px 0}
.hbar .tr{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.hbar .tr i{display:block;height:100%;background:var(--bar-b);border-radius:99px}
.hbar b{text-align:right}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:6px 0 14px;border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.legend li{display:flex;align-items:center;gap:10px}
.legend .sw{width:12px;height:12px;border-radius:4px;flex:none}
.legend b{margin-left:auto}
.chart{width:100%;height:auto;display:block}
.chart text{font:600 12px var(--f-b);fill:var(--muted)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ba{fill:var(--bar-a)}.chart .bb{fill:var(--bar-b)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-weight:600;font-size:.88rem;margin:0 0 6px}
.key i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--clm-bg);color:var(--clm-fg);display:grid;place-items:center;font:800 .8rem var(--f-d);flex:none}
.rank .r{margin-left:auto;text-align:right;font-weight:700}
.rank small{display:block;color:var(--muted);font-weight:500}

/* forms + tables */
.filters{display:grid;grid-template-columns:minmax(180px,2fr) repeat(3,minmax(130px,1fr));gap:10px;margin-bottom:12px}
@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.in{width:100%;min-height:44px;border:2px solid var(--line2);border-radius:10px;background:var(--card);padding:8px 12px}
textarea.in{min-height:96px;resize:vertical}
label{font-weight:600;display:block;margin-bottom:4px}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--teal-d)}
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ever);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.bulk .btn{border-color:rgba(255,255,255,.5);color:#fff;min-height:36px}
.bulk .btn:hover{background:rgba(255,255,255,.12)}
.bulk .btn-danger{border-color:#FF9C8C;color:#FFB4A8}
.tw{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:700px}
tbody td:nth-child(3){min-width:230px}.mono,td .chip,th{white-space:nowrap}
th,td{text-align:left;padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;background:var(--soft);font:700 .82rem var(--f-b);color:var(--muted);white-space:nowrap}
tbody tr:hover{background:var(--soft)}
td small{display:block;color:var(--muted)}
td input[type=checkbox],th input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal-d)}
.fl{color:var(--red);vertical-align:-.25em;margin-left:6px}
@media(max-width:1000px){.hide-md{display:none}}
.count{font-weight:600;margin:0 0 10px}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;max-width:min(680px,calc(100vw - 24px));width:100%;background:var(--card);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(7,27,25,.6)}
.dlg{padding:22px;overflow:auto;max-height:90vh;position:relative}
.dlg h2{font-size:1.35rem;padding-right:44px}
.dlg .x{position:absolute;right:10px;top:10px;width:44px;height:44px;border:0;background:none;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.dlg .x:hover{background:var(--soft)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.err{color:var(--red);font-weight:600;margin:0 0 10px}
.tl{list-style:none;padding:0 0 0 14px;margin:8px 0 0;border-left:2px solid var(--line);display:grid;gap:12px;max-height:210px;overflow:auto}
.tl small{display:block;color:var(--muted)}
.tl p{margin:2px 0 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px;align-items:center}
.actions .left{margin-right:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ever);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:1000;max-width:calc(100vw - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper)}.gate[hidden]{display:none}.gcard{max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);text-align:center}
</style>
</head>

    SB.from('profiles').select('id,name,is_admin,roles,created_at'),SB.from('flags').select('*'),SB.from('user_settings').select('user_id,hours'),
    SB.from('admin_log').select('*').order('created_at',{ascending:false}).limit(200)]);
  const bad=[pr,fl,st,lg].find(r=>r.error);if(bad)throw bad.error;
  state.people=pr.data;names={};pr.data.forEach(p=>names[p.id]=p.name||'');
  state.hoursMap={};st.data.forEach(r=>state.hoursMap[r.user_id]=+r.hours||0);
  const tl={};ev.forEach(e=>(tl[e.issue_id]=tl[e.issue_id]||[]).push({ts:Date.parse(e.created_at),who:e.author_id,type:e.type,text:e.text,status:e.status,photo:e.photo_url}));
  state.issues=iss.map(i=>({id:i.id,title:i.title,cat:i.category,status:i.status,place:i.place,desc:i.description,reporter:i.reporter_id,volunteer:i.volunteer_id,reportedAt:Date.parse(i.created_at),timeline:tl[i.id]||[]}));
  state.flagInfo={};fl.data.forEach(f=>(state.flagInfo[f.issue_id]=state.flagInfo[f.issue_id]||[]).push(f));state.flags=Object.keys(state.flagInfo).map(Number);
  state.log=lg.data.map(l=>({ts:Date.parse(l.created_at),text:l.text}));fromSite=true}

/* ---------- helpers ---------- */
const iss=id=>state.issues.find(i=>i.id===+id);
const short=n=>{const p=String(n||'Neighbor').trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1][0].toUpperCase()+'.':p[0]};
const who=id=>!id?'A neighbor':(names[id]?short(names[id]):'A neighbor')+(id===me?' (you)':'');
const initials=n=>String(n||'N').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const gn=id=>'GN-'+String(id).padStart(4,'0');
const lastTs=i=>i.timeline.length?Math.max(...i.timeline.map(t=>t.ts)):i.reportedAt;
const ageH=ts=>(Date.now()-ts)/H;
const dur=h=>h<1?'under an hour':h<48?Math.round(h)+' hours':(h/24).toFixed(1)+' days';
const rel=ts=>{const m=Math.round((Date.now()-ts)/6e4);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' hr ago';const d=Math.round(h/24);if(d===1)return'yesterday';if(d<7)return d+' days ago';return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
const absT=ts=>new Date(ts).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const timeEl=ts=>`<time datetime="${new Date(ts).toISOString()}" title="${esc(absT(ts))}">${rel(ts)}</time>`;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3600)}
function attention(){const out=[];
  state.issues.forEach(i=>{
    if(state.flags.includes(i.id))out.push({i,kind:'flag',sev:0,why:'Flagged for review'});
    else if((i.status==='Claimed'||i.status==='In Progress')&&ageH(lastTs(i))>72)out.push({i,kind:'stale',sev:1,why:'No update for '+dur(ageH(lastTs(i)))});
    else if(i.status==='New'&&ageH(i.reportedAt)>48)out.push({i,kind:'wait',sev:2,why:'Waiting '+dur(ageH(i.reportedAt))+' for a volunteer'})});
  return out.sort((a,b)=>a.sev-b.sev||a.i.reportedAt-b.i.reportedAt)}

/* ---------- admin actions (run in the database, admins only) ---------- */
async function rpc(fn,args){const r=await SB.rpc(fn,args);if(r.error)throw r.error}
async function act(msg,fn){try{await fn();await loadAll();render();toast(msg)}catch(e){toast((e&&e.message)||'That didn’t work. Please try again.')}}
const setStatusMany=(ids,st)=>rpc('admin_set_status',{p_ids:ids,p_status:st});
const removeMany=ids=>rpc('admin_delete_issues',{p_ids:ids});
const releaseClaim=id=>rpc('admin_release_claim',{p_id:+id});
const unflag=id=>rpc('admin_dismiss_flag',{p_id:+id});
function confirmDlg(o){
  dlg.innerHTML=`<div class="dlg"><button type="button" class="x" data-close aria-label="Close">${ic('x',22)}</button><h2 id="dlgTitle">${esc(o.title)}</h2><p class="muted">${esc(o.msg)}</p><div class="actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn ${o.danger?'btn-danger':'btn-primary'}" id="cfOk">${esc(o.label)}</button></div></div>`;
  dlg.showModal();wire();$('#cfOk').onclick=()=>{dlg.close();o.fn()}}
function wire(){$$('[data-close]',dlg).forEach(b=>b.onclick=()=>dlg.close())}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* ---------- report detail ---------- */
const verb=t=>t.type==='reported'?'reported this':t.type==='claim'?'claimed this':t.type==='release'?'released this':t.type==='status'?'set the status to '+t.status:'added a note';
function openIssue(id){
  const i=iss(id);if(!i)return;
  const vols=[['','No one']].concat(knownIds().map(k=>[k,who(k)]));
  const flagged=state.flags.includes(i.id);
  dlg.innerHTML=`<form class="dlg" id="mf" novalidate><button type="button" class="x" data-close aria-label="Close">${ic('x',22)}</button>
  <h2 id="dlgTitle">${gn(i.id)}</h2>
  <p class="row" style="margin:0">${chip(i.status)}${catChip(i.cat)}${flagged?`<span class="chip st-new" style="background:var(--red-bg);color:var(--red)">${ic('flag',14)} Flagged</span>`:''}<span class="muted">Reported by ${esc(who(i.reporter))}, ${timeEl(i.reportedAt)}</span></p>
  <div class="fgrid">
   <div class="full"><label for="ft">Title</label><input class="in" id="ft" maxlength="80" value="${esc(i.title)}"></div>
   <div><label for="fc">Category</label><select class="in" id="fc">${Object.keys(CAT).map(k=>`<option value="${k}"${i.cat===k?' selected':''}>${CAT[k]}</option>`).join('')}</select></div>
   <div><label for="fs">Status</label><select class="in" id="fs">${STATUSES.map(s=>`<option${i.status===s?' selected':''}>${s}</option>`).join('')}</select></div>
   <div><label for="fv">Volunteer</label><select class="in" id="fv">${vols.map(v=>`<option value="${v[0]}"${(i.volunteer||'')===v[0]?' selected':''}>${esc(v[1])}</option>`).join('')}</select></div>
   <div><label for="fp">Place</label><input class="in" id="fp" maxlength="120" value="${esc(i.place)}"></div>
   <div class="full"><label for="fd">Description</label><textarea class="in" id="fd" maxlength="600">${esc(i.desc)}</textarea></div>
  </div>
  <p class="err" id="merr" role="alert" hidden></p>
  <h3>Timeline</h3>
  <ol class="tl">${[...i.timeline].reverse().map(t=>`<li><b>${esc(who(t.who))}</b> ${verb(t)}<small>${esc(absT(t.ts))}</small>${t.text?`<p>${esc(t.text)}</p>`:''}</li>`).join('')}</ol>
  <div class="actions"><button type="button" class="btn btn-danger left" id="mdel">${ic('trash',18)} Delete report</button>${flagged?'<button type="button" class="btn btn-ghost" id="mkeep">Dismiss flag</button>':''}<button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary">Save changes</button></div></form>`;
  dlg.showModal();wire();

    dlg.close();act('Report removed.',()=>removeMany([i.id]))};
  const k=$('#mkeep');if(k)k.onclick=()=>{dlg.close();act('Flag dismissed. The report stays up.',()=>unflag(i.id))};
  $('#mf').onsubmit=e=>{e.preventDefault();
    const t=$('#ft').value.trim(),st=fs.value,vol=fv.value||null,er=$('#merr');
    const bad=!t?'Enter a title.':t.length<8?'The title must be at least 8 characters.':((st==='Claimed'||st==='In Progress')&&!vol)?'Choose a volunteer for a task that is claimed or in progress.':'';
    if(bad){er.textContent=bad;er.hidden=false;(!t?$('#ft'):fv).focus();return}
    dlg.close();act('Saved.',()=>rpc('admin_update_issue',{p_id:i.id,p_title:t,p_category:$('#fc').value,p_place:$('#fp').value.trim()||i.place,p_description:$('#fd').value.trim()||t,p_status:st,p_volunteer:st==='New'?null:vol}))}}

/* ---------- views ---------- */
const VIEWS={};
const NAV=[['overview','Overview','dash'],['reports','Reports','list'],['moderation','Moderation','shield'],['people','People','users'],['activity','Activity','log'],['data','Data','download']];

function chartSVG(){
  const W=420,Ht=250,pl=28,pr=4,pt=10,pb=26,n=12;
  const rep=new Array(n).fill(0),res=new Array(n).fill(0),now=new Date();
  const slot=ts=>{const d=new Date(ts);return n-1-((now.getFullYear()-d.getFullYear())*12+now.getMonth()-d.getMonth())};
  state.issues.forEach(i=>{const a=slot(i.reportedAt);if(a>=0&&a<n)rep[a]++;if(i.status==='Resolved'){const b=slot(lastTs(i));if(b>=0&&b<n)res[b]++}});
  const max=Math.max(5,Math.ceil(Math.max(...rep,...res)/5)*5),gw=(W-pl-pr)/n,bw=gw*.3,y=v=>pt+(Ht-pt-pb)*(1-v/max);
  const mon=k=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(n-1-k));return d.toLocaleString('en',{month:'short'})};
  const grid=[0,max/2,max].map(v=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const bars=rep.map((v,k)=>{const x=pl+k*gw+gw/2-bw-1;return `<rect class="ba" x="${x}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="2"/><rect class="bb" x="${x+bw+2}" y="${y(res[k])}" width="${bw}" height="${y(0)-y(res[k])}" rx="2"/><text x="${pl+k*gw+gw/2}" y="${Ht-8}" text-anchor="middle">${mon(k)}</text>`}).join('');
  const tbl=`<table class="vh"><caption>Reports and resolved reports by month</caption><thead><tr><th>Month</th><th>Reported</th><th>Resolved</th></tr></thead><tbody>${rep.map((v,k)=>`<tr><td>${mon(k)}</td><td>${v}</td><td>${res[k]}</td></tr>`).join('')}</tbody></table>`;
  return `<p class="key"><span><i style="background:var(--bar-a)"></i>Reported</span><span><i style="background:var(--bar-b)"></i>Resolved</span></p><svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Bar chart of reports and resolved reports for the last 12 months. Latest month: ${rep[n-1]} reported, ${res[n-1]} resolved.">${grid}${bars}</svg>${tbl}`}

function knownIds(){return state.people.map(p=>p.id)}
function peopleStats(){const L=state.issues;return state.people.map(p=>{const id=p.id;return{id,name:p.name||'Unnamed',admin:p.is_admin,hours:state.hoursMap[id]||0,reports:L.filter(i=>i.reporter===id).length,claimed:L.filter(i=>i.volunteer===id).length,active:L.filter(i=>i.volunteer===id&&(i.status==='Claimed'||i.status==='In Progress')).length,resolved:L.filter(i=>i.volunteer===id&&i.status==='Resolved').length}})}

VIEWS.overview=function(){
  const L=state.issues,n=s=>L.filter(i=>i.status===s).length,res=L.filter(i=>i.status==='Resolved');
  const avg=res.length?res.reduce((a,i)=>a+(lastTs(i)-i.reportedAt)/H,0)/res.length:null;
  const att=attention(),fl=att.filter(a=>a.kind==='flag').length,open=L.length-res.length;
  const rate=L.length?Math.round(res.length/L.length*100):0;
  const cats=Object.keys(CAT).map(k=>({k,c:L.filter(i=>i.cat===k).length})),cmax=Math.max(1,...cats.map(c=>c.c));
  const top=peopleStats().filter(p=>p.claimed).sort((a,b)=>b.resolved-a.resolved||b.claimed-a.claimed).slice(0,5);
  const acts=a=>a.kind==='flag'?`<button type="button" class="btn btn-ghost btn-sm" data-do="unflag" data-id="${a.i.id}">Keep</button><button type="button" class="btn btn-danger btn-sm" data-do="delete" data-id="${a.i.id}">Remove</button>`:a.kind==='stale'?`<button type="button" class="btn btn-ghost btn-sm" data-do="release" data-id="${a.i.id}">Release claim</button>`:'';
  const html=`${fromSite?'':`<p class="note">${ic('info',20)}<span>No site data found in this browser. Open this page from the same address as the site, after someone has used it, and the reports will appear here.</span></p>`}
  <div class="strip">
   <div><b>${open}</b><span>Open reports</span><small>${n('New')} waiting for a volunteer</small></div>
   <div><b>${n('Claimed')+n('In Progress')}</b><span>Being handled</span><small>${n('Claimed')} claimed, ${n('In Progress')} in progress</small></div>
   <div><b>${res.length}</b><span>Resolved</span><small>${rate}% of all ${L.length} reports</small></div>
   <div><b>${avg==null?'None yet':avg<48?Math.round(avg)+' hr':(avg/24).toFixed(1)+' d'}</b><span>Average time to resolve</span><small>Report to last update</small></div>
   <a href="#/reports?attn=1" class="${att.length?'hot':''}"><b>${att.length}</b><span>Need attention</span><small>${fl} flagged</small></a>
  </div>
  <div class="grid g2">
   <section class="panel" aria-labelledby="h-att"><h2 id="h-att">Needs attention</h2>
    ${att.length?`<ul class="alist">${att.slice(0,6).map(a=>`<li><div class="t"><button type="button" class="lnk" data-do="open" data-id="${a.i.id}">${esc(a.i.title)}</button><span class="why ${a.kind}">${ic(a.kind==='flag'?'flag':'clock',15)}${esc(a.why)}</span><small>${gn(a.i.id)} · ${esc(a.i.place)}</small></div><div class="row">${acts(a)}<button type="button" class="btn btn-ghost btn-sm" data-do="open" data-id="${a.i.id}">Manage</button></div></li>`).join('')}</ul>${att.length>6?`<p style="margin:12px 0 0"><a href="#/reports?attn=1">See all ${att.length}</a></p>`:''}`:`<div class="empty"><b>Nothing needs attention</b>Every report is moving and nothing is flagged.</div>`}
   </section>
   <section class="panel" aria-labelledby="h-ch"><h2 id="h-ch">Reports and resolutions, last 12 months</h2>${chartSVG()}</section>
  </div>
  <div class="grid g3">
   <section class="panel" aria-labelledby="h-st"><h2 id="h-st">By status</h2>
    <div class="stack" aria-hidden="true">${STATUSES.map(s=>n(s)?`<i style="width:${n(s)/Math.max(1,L.length)*100}%;background:${ST[s].mk}"></i>`:'').join('')}</div>
    <ul class="legend">${STATUSES.map(s=>`<li><span class="sw" style="background:${ST[s].mk}"></span>${s}<b>${n(s)}</b></li>`).join('')}</ul></section>
   <section class="panel" aria-labelledby="h-ct"><h2 id="h-ct">By category</h2>${cats.map(c=>`<div class="hbar"><span>${esc(CAT[c.k])}</span><span class="tr"><i style="width:${c.c/cmax*100}%"></i></span><b>${c.c}</b></div>`).join('')}</section>
   <section class="panel" aria-labelledby="h-vo"><h2 id="h-vo">Most active volunteers</h2>${top.length?`<ol class="rank">${top.map(p=>`<li><span class="av" aria-hidden="true">${esc(initials(p.name))}</span><span>${esc(p.name)}<small>${p.active} active</small></span><span class="r">${p.resolved}<small>resolved</small></span></li>`).join('')}</ol>`:'<div class="empty">No one has claimed a report yet.</div>'}</section>
  </div>`;
  return{title:'Overview',sub:'What is happening across reports and volunteers.',html}};

let F={q:'',status:'all',cat:'all',vol:'all',attn:false,sort:'new'},SEL=new Set();
function filteredIssues(){
  const q=F.q.trim().toLowerCase(),at=F.attn?new Set(attention().map(a=>a.i.id)):null;
  let L=state.issues.filter(i=>(F.status==='all'||i.status===F.status)&&(F.cat==='all'||i.cat===F.cat)&&(F.vol==='all'||(F.vol==='none'?!i.volunteer:i.volunteer===F.vol))&&(!at||at.has(i.id))&&(!q||(i.title+' '+i.place+' '+gn(i.id)+' '+who(i.reporter)).toLowerCase().includes(q)));
  const by={new:(a,b)=>b.reportedAt-a.reportedAt,old:(a,b)=>a.reportedAt-b.reportedAt,quiet:(a,b)=>(a.status==='Resolved')-(b.status==='Resolved')||lastTs(a)-lastTs(b),status:(a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status)||b.reportedAt-a.reportedAt};
  return L.sort(by[F.sort])}
function drawRows(){
  const L=filteredIssues();SEL.forEach(id=>{if(!L.some(i=>i.id===id))SEL.delete(id)});
  $('#count').textContent=`${L.length} of ${state.issues.length} reports`;
  const b=$('#bulk');b.hidden=!SEL.size;$('#bn').textContent=SEL.size+' selected';
  $('#tbl').innerHTML=L.length?`<div class="tw"><table><caption class="vh">Reports</caption><thead><tr><th scope="col"><input type="checkbox" id="selAll" aria-label="Select all shown reports"${L.length&&L.every(i=>SEL.has(i.id))?' checked':''}></th><th scope="col">ID</th><th scope="col">Report</th><th scope="col">Status</th><th scope="col" class="hide-md">Volunteer</th><th scope="col" class="hide-md">Reported</th><th scope="col"><span class="vh">Actions</span></th></tr></thead><tbody>${L.map(i=>`<tr><td><input type="checkbox" data-sel="${i.id}" aria-label="Select ${gn(i.id)}"${SEL.has(i.id)?' checked':''}></td><td class="mono">${gn(i.id)}</td><td><button type="button" class="lnk" data-do="open" data-id="${i.id}">${esc(i.title)}</button>${state.flags.includes(i.id)?`<span class="fl" title="Flagged for review">${ic('flag',16)}<span class="vh">Flagged</span></span>`:''}<small>${esc(i.place)}</small><span style="display:block;margin-top:6px">${catChip(i.cat)}</span></td><td>${chip(i.status)}</td><td class="hide-md">${i.volunteer?esc(who(i.volunteer)):'<span class="muted">None</span>'}</td><td class="hide-md">${timeEl(i.reportedAt)}<small>updated ${rel(lastTs(i))}</small></td><td><button type="button" class="btn btn-ghost btn-sm" data-do="open" data-id="${i.id}">Manage</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>No reports match</b>Try clearing a filter or changing your search.</div>`;
  const sa=$('#selAll');if(sa)sa.onchange=()=>{L.forEach(i=>sa.checked?SEL.add(i.id):SEL.delete(i.id));drawRows()};
  $$('[data-sel]').forEach(c=>c.onchange=()=>{c.checked?SEL.add(+c.dataset.sel):SEL.delete(+c.dataset.sel);drawRows()})}
VIEWS.reports=function(q){

  const html=`<form class="filters" id="rf" role="search" aria-label="Filter reports">
   <div class="q"><label class="vh" for="fq">Search reports</label><input class="in" id="fq" type="search" placeholder="Search title, place, ID or reporter" value="${esc(F.q)}"></div>
   <div><label class="vh" for="fst">Status</label><select class="in" id="fst">${opt([['all','All statuses'],...STATUSES.map(s=>[s,s])],F.status)}</select></div>
   <div><label class="vh" for="fct">Category</label><select class="in" id="fct">${opt([['all','All categories'],...Object.keys(CAT).map(k=>[k,CAT[k]])],F.cat)}</select></div>
   <div><label class="vh" for="fso">Sort</label><select class="in" id="fso">${opt([['new','Newest first'],['old','Oldest first'],['quiet','Longest without an update'],['status','By status']],F.sort)}</select></div>
   <div><label class="vh" for="fvo">Volunteer</label><select class="in" id="fvo">${opt([['all','Any volunteer'],['none','No volunteer'],...knownIds().map(k=>[k,who(k)])],F.vol)}</select></div>
   <label class="chk"><input type="checkbox" id="fat"${F.attn?' checked':''}> Needs attention only</label>
  </form>
  <div class="bulk" id="bulk" hidden><b id="bn"></b><button type="button" class="btn btn-ghost btn-sm" data-do="bulk-resolve">Mark resolved</button><button type="button" class="btn btn-ghost btn-sm" data-do="bulk-reopen">Reopen as new</button><button type="button" class="btn btn-danger btn-sm" data-do="bulk-delete">${ic('trash',16)} Delete</button><button type="button" class="btn btn-ghost btn-sm" data-do="bulk-clear">Clear</button></div>

    $('#fso').onchange=e=>{F.sort=e.target.value;drawRows()};$('#fvo').onchange=e=>{F.vol=e.target.value;drawRows()};
    $('#fat').onchange=e=>{F.attn=e.target.checked;drawRows()};drawRows()}}};

VIEWS.moderation=function(){
  const L=state.issues.filter(i=>state.flags.includes(i.id));
  const html=L.length?`<section class="panel" aria-labelledby="h-fq"><h2 id="h-fq">${L.length} ${L.length===1?'report':'reports'} waiting for review</h2><p class="muted">Neighbors flagged these. Keep a report if it is fine, or remove it.</p><ul class="alist">${L.map(i=>`<li><div class="t"><button type="button" class="lnk" data-do="open" data-id="${i.id}">${esc(i.title)}</button><span class="row" style="margin-top:4px">${chip(i.status)}${catChip(i.cat)}</span><small>${gn(i.id)} · ${esc(i.place)} · reported by ${esc(who(i.reporter))} ${rel(i.reportedAt)}</small>${(state.flagInfo[i.id]||[]).filter(f=>f.reason).map(f=>`<small>Reason: ${esc(f.reason)}</small>`).join('')}</div><div class="row"><button type="button" class="btn btn-ghost btn-sm" data-do="unflag" data-id="${i.id}">Keep report</button><button type="button" class="btn btn-danger btn-sm" data-do="delete" data-id="${i.id}">Remove</button><button type="button" class="btn btn-ghost btn-sm" data-do="open" data-id="${i.id}">Open</button></div></li>`).join('')}</ul></section>`:`<div class="empty"><b>Nothing to review</b>When a neighbor flags a report on the site, it will show up here.</div>`;
  return{title:'Moderation',sub:'Reports that neighbors have flagged.',html}};

VIEWS.people=function(){
  const P=peopleStats().sort((a,b)=>b.resolved-a.resolved||b.claimed-a.claimed||b.reports-a.reports);
  const html=!P.length?`<div class="empty"><b>No one yet</b>People show up here once they create an account.</div>`:`<div class="tw"><table><caption class="vh">People</caption><thead><tr><th scope="col">Person</th><th scope="col">Reports</th><th scope="col">Tasks claimed</th><th scope="col">Active now</th><th scope="col">Resolved</th><th scope="col" class="hide-md">Hours given</th></tr></thead><tbody>${P.map(p=>`<tr><td><span class="row" style="flex-wrap:nowrap"><span class="av" aria-hidden="true">${esc(initials(p.name))}</span><span>${esc(p.name)}${p.admin?'<small>Admin</small>':''}</span></span></td><td class="mono">${p.reports}</td><td class="mono">${p.claimed}</td><td class="mono">${p.active}</td><td class="mono">${p.resolved}</td><td class="hide-md mono">${p.hours}</td></tr>`).join('')}</tbody></table></div><p class="muted" style="margin-top:12px">Everyone with an account is listed.</p>`;
  return{title:'People',sub:'Who is reporting and who is helping.',html}};

VIEWS.activity=function(){
  const ev=[];state.issues.forEach(i=>i.timeline.forEach(t=>ev.push({t,i})));ev.sort((a,b)=>b.t.ts-a.t.ts);
  const v2=t=>t.type==='reported'?'reported':t.type==='claim'?'claimed':t.type==='release'?'released':t.type==='status'?'changed the status to '+t.status+' on':'added an update to';
  const log=state.log;
  const html=`<div class="grid g2"><section class="panel" aria-labelledby="h-al"><h2 id="h-al">Admin actions</h2>${log.length?`<ul class="alist">${log.slice(0,30).map(l=>`<li><div class="t">${esc(l.text)}<small>${timeEl(l.ts)}</small></div></li>`).join('')}</ul>`:'<div class="empty"><b>No admin actions yet</b>Changes you make here are listed so you can see what happened.</div>'}</section>
  <section class="panel" aria-labelledby="h-sa"><h2 id="h-sa">Recent activity on the site</h2><ul class="alist">${ev.slice(0,30).map(({t,i})=>`<li><div class="t"><b>${esc(who(t.who))}</b> ${v2(t)} <button type="button" class="lnk" data-do="open" data-id="${i.id}">${esc(i.title)}</button><small>${timeEl(t.ts)}</small></div></li>`).join('')}</ul></section></div>`;
  return{title:'Activity',sub:'Admin actions and the latest updates from neighbors.',html}};

VIEWS.data=function(){
  const html=`<div class="grid g2"><section class="panel" aria-labelledby="h-ex"><h2 id="h-ex">Export</h2><p class="muted">Download a copy of the data in your database.</p><div class="row"><button type="button" class="btn btn-primary" data-do="export-csv">${ic('download',18)} Reports (CSV)</button><button type="button" class="btn btn-ghost" data-do="export-json">${ic('download',18)} Everything (JSON)</button></div></section>
  <section class="panel" aria-labelledby="h-st2"><h2 id="h-st2">Database</h2><p class="muted">Data comes from your Supabase project. ${state.issues.length} reports, ${state.flags.length} flagged, ${state.people.length} people.</p><div class="row"><button type="button" class="btn btn-ghost" data-do="refresh">${ic('refresh',18)} Reload from database</button></div></section></div>`;
  return{title:'Data',sub:'Export or reload the data.',html}};

/* ---------- export ---------- */
function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const csvCell=v=>{let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function exportCSV(){
  const rows=[['ID','Title','Category','Status','Place','Reported by','Volunteer','Reported at','Last update','Flagged']].concat(state.issues.map(i=>[gn(i.id),i.title,CAT[i.cat]||i.cat,i.status,i.place,who(i.reporter),i.volunteer?who(i.volunteer):'',new Date(i.reportedAt).toISOString(),new Date(lastTs(i)).toISOString(),state.flags.includes(i.id)?'Yes':'No']));
  download('cs-society-reports.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));toast('Reports exported.')}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-do]');if(!b)return;const a=b.dataset.do,id=b.dataset.id,ids=[...SEL];
  if(a==='open')return openIssue(id);
  if(a==='unflag')return act('Flag dismissed. The report stays up.',()=>unflag(id));
  if(a==='release')return act('Claim released. The report is open to volunteers again.',()=>releaseClaim(id));
  if(a==='delete'){const i=iss(id);return confirmDlg({title:'Remove this report?',msg:`“${i?i.title:''}” will be removed from the site. This can’t be undone.`,label:'Remove report',danger:true,fn:()=>act('Report removed.',()=>removeMany([+id]))})}
  if(a==='bulk-clear'){SEL.clear();return drawRows()}
  if(a==='bulk-resolve'){SEL.clear();return act(ids.length+' marked resolved.',()=>setStatusMany(ids,'Resolved'))}
  if(a==='bulk-reopen'){SEL.clear();return act(ids.length+' reopened as new.',()=>setStatusMany(ids,'New'))}
  if(a==='bulk-delete')return confirmDlg({title:`Delete ${ids.length} ${ids.length===1?'report':'reports'}?`,msg:'They will be removed from the site. This can’t be undone.',label:'Delete',danger:true,fn:()=>{SEL.clear();act(ids.length+' deleted.',()=>removeMany(ids))}});
  if(a==='export-csv')return exportCSV();
  if(a==='export-json'){download('cs-society-data.json','application/json',JSON.stringify({issues:state.issues,people:state.people,flags:state.flagInfo},null,2));return toast('Data exported.')}
  if(a==='refresh')return act('Reloaded from the database.',async()=>{});
});


/* ---------- shell ---------- */
const parseHash=()=>{const h=location.hash.slice(1)||'/overview';const[p,q]=h.split('?');return{r:p.split('/').filter(Boolean)[0]||'overview',q:new URLSearchParams(q||'')}};
function render(){
  const{r,q}=parseHash(),key=VIEWS[r]?r:'overview',flags=state.flags.filter(f=>iss(f)).length;
  $('#nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}"${n[0]===key?' aria-current="page"':''}>${ic(n[2],20)}<span>${n[1]}</span>${n[0]==='moderation'&&flags?`<span class="n" aria-label="${flags} flagged">${flags}</span>`:''}</a>`).join('');
  const v=VIEWS[key](q);
  $('#ptitle').textContent=v.title;$('#psub').textContent=v.sub||'';document.title=v.title+' · CS Society Admin';
  view.innerHTML=v.html;if(v.mount)v.mount();
  $('#src').innerHTML='<i></i>Connected to your database'}
function route(){render();window.scrollTo(0,0);$('#ptitle').focus({preventScroll:true})}
window.addEventListener('hashchange',route);

/* theme */
function setTheme(t){document.documentElement.dataset.theme=t;$('#themeBtn').setAttribute('aria-pressed',t==='dark');$('#themeBtn span').textContent=t==='dark'?'Light mode':'Dark mode'}
let th=null;try{th=localStorage.getItem(THEMEKEY)}catch(e){}
setTheme(th||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(t);try{localStorage.setItem(THEMEKEY,t)}catch(e){}};
/* ---------- access check, then start ---------- */
function gate(t,m){$('#gt').textContent=t;$('#gm').textContent=m;$('#gate').hidden=false;$('#shell').hidden=true}
(async function boot(){
  if(!SB)return gate('Not connected','This page needs config.js with your Supabase URL and key.');
  const s=await SB.auth.getSession();
  if(!s.data.session)return gate('Sign in required','Sign in on the main site with an admin account, then open this page again.');
  me=s.data.session.user.id;
  const p=await SB.from('profiles').select('name,is_admin').eq('id',me).maybeSingle();
  if(!p.data||!p.data.is_admin)return gate('Access denied','This account is not an admin. Ask the site owner to give you admin access.');
  state.profile.name=p.data.name;
  try{await loadAll()}catch(e){return gate('Couldn’t load the data',(e&&e.message)||'Check your connection, and make sure supabase/admin.sql has been run.')}
  $('#gate').hidden=true;$('#shell').hidden=false;route();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!dlg.open)loadAll().then(render).catch(()=>{})});
  SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
})();
</script>
